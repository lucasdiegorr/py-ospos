# Pre-commit hooks for py-ospos (FastAPI backend + React/TS frontend + PostgreSQL)
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # ---------------------------------------------------------------------------
  # General hygiene hooks (all files, all stages)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: forbid-submodules

  # ---------------------------------------------------------------------------
  # Backend: Python lint + format (ruff)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # Backend: Python type checking (mypy)
  # Add project dependencies as additional_dependencies once pyproject.toml exists
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, backend/app]
        pass_filenames: false
        additional_dependencies: []

  # ---------------------------------------------------------------------------
  # Backend: Python security scanner (bandit)
  # Scans only staged files; severity >= medium causes failure by default
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-ll]

  # ---------------------------------------------------------------------------
  # Security: secret detection (gitleaks) on all stages
  # Scans every commit for secrets/tokens/keys; blocks if any are found.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--no-banner]

  # ---------------------------------------------------------------------------
  # Frontend: formatting (prettier) for TS/TSX/JS/CSS/JSON/HTML
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, css, scss, html, json]
        args:
          - --write
          - --list-different
          - --ignore-unknown

  # ---------------------------------------------------------------------------
  # Branch protection: block direct pushes to main/master (pre-push only)
  # Server-side branch protection (GitHub/GitLab) is the authoritative control;
  # this local hook is a fast-failing safety net for developers.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: protect-main-branch
        name: Protect main/master branch
        entry: bash -c 'branch="${PRE_COMMIT_PUSH_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"; if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then echo "Direct push to ${branch} is not allowed. Create a feature branch and open a pull request." >&2; exit 1; fi'
        language: system
        stages: [pre-push]
        always_run: true

  # ---------------------------------------------------------------------------
  # Commit message convention (Conventional Commits)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
