services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ospos
      POSTGRES_PASSWORD: ospos
      POSTGRES_DB: ospos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ospos"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
