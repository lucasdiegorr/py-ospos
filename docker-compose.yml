services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ospos
      POSTGRES_PASSWORD: ospos
      POSTGRES_DB: ospos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ospos"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OSPOS_DATABASE_URL: postgresql+psycopg://ospos:ospos@db:5432/ospos
      OSPOS_JWT_SECRET: change-me-in-production
      OSPOS_JWT_ALGORITHM: HS256
      OSPOS_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OSPOS_REFRESH_TOKEN_EXPIRE_DAYS: 7
      OSPOS_LOGIN_MAX_ATTEMPTS: 5
      OSPOS_LOGIN_LOCKOUT_MINUTES: 15
      OSPOS_ADMIN_USERNAME: admin
      OSPOS_ADMIN_PASSWORD: change-me-in-production
      OSPOS_ADMIN_NAME: Administrator
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
